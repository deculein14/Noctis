<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Noctis - Vault</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vault.css">
</head>
<body class="app-body">

  <div class="notification-wrapper" id="notification-wrapper">
    <button class="notification-bell" id="notification-bell" aria-label="Renewal notifications">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notification-dot" id="notification-dot" style="display:none;"></span>
    </button>
    <div class="notification-dropdown" id="notification-dropdown" style="display:none;"></div>
  </div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">Noctis</div>

    <div class="sidebar-nav">
      <button class="sidebar-item active" data-section="accounts">
        <span class="sidebar-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span>Accounts</span>
      </button>
      <button class="sidebar-item" data-section="subscriptions">
        <span class="sidebar-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2z"/></svg></span>
        <span>Subscriptions</span>
      </button>
      <button class="sidebar-item" data-section="media">
        <span class="sidebar-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span>
        <span>Images &amp; Videos</span>
      </button>
    </div>

    <div class="sidebar-nav sidebar-nav-bottom">
      <button class="sidebar-item" data-section="settings">
        <span class="sidebar-icon"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span>Settings</span>
      </button>
    </div>
  </nav>

  <main class="content-area">

    <section id="section-accounts" class="content-section">
      <div id="main-view">
        <div class="vault-header">
          <h1 class="vault-title">Your Vault</h1>
          <button class="add-button" id="add-button"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>

        <input type="text" class="search-input" id="search-input" placeholder="Search...">

        <div class="chip-row" id="chip-row"></div>

        <div class="entries-container" id="entries-container"></div>
      </div>

      <div id="group-list-view" style="display:none;"></div>

      <div id="detail-view" style="display:none;"></div>
    </section>

    <section id="section-subscriptions" class="content-section" style="display:none;">
      <div id="subscriptions-main-view">
        <div class="vault-header">
          <h1 class="vault-title">Subscriptions</h1>
          <button class="add-button" id="add-subscription-button"><svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>

        <div class="entries-container" id="subscriptions-container"></div>
      </div>

      <div id="subscription-detail-view" style="display:none;"></div>
    </section>

    <section id="section-media" class="content-section" style="display:none;">
      <div class="placeholder-page">
        <h1 class="placeholder-title">Images &amp; Videos</h1>
        <p class="placeholder-text">This section is coming soon.</p>
      </div>
    </section>

    <section id="section-settings" class="content-section" style="display:none;">
      <div class="placeholder-page">
        <h1 class="placeholder-title">Settings</h1>
        <p class="placeholder-text">This section is coming soon.</p>
      </div>
    </section>

  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-box" id="modal-box"></div>
  </div>

  <script src="vault.js"></script>
</body>
</html>
